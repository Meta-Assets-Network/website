 # ====================== 1. HTTP 80 端口：重定向到 HTTPS（文档推荐方案）======================
server {
    listen 80;                  # 监听 HTTP 默认端口 80
    server_name bpm.ink;        # 匹配你的域名
    access_log /var/log/nginx/http_bpm_redirect.log; # 可选：记录重定向日志

    # 核心指令：301 永久重定向（SEO 友好，文档推荐）
    # $host 保留请求域名，$request_uri 保留原始路径（如 /swap）
    return 301 https://$host$request_uri;
}

# ====================== 2. HTTPS 443 端口：提供加密服务======================
server {
    listen 443 ssl;             # 监听 HTTPS 默认端口 443
    server_name bpm.ink;        # 与 HTTP 块的域名一致

    # SSL 证书配置（替换为你的实际路径）
    ssl_certificate         /root/https-key/bpm.ink.pem;   # 证书文件
    ssl_certificate_key     /root/https-key/bpm.ink.key;   # 私钥文件

    # 推荐的 SSL 安全配置（参考摘要4、6，提升兼容性和安全性）
    ssl_protocols           TLSv1.2 TLSv1.3;               # 仅启用安全的 TLS 协议
    ssl_ciphers             HIGH:!aNULL:!MD5:!ADH;         # 强加密算法
    ssl_prefer_server_ciphers on;                          # 优先使用服务器端算法
    ssl_session_timeout     5m;                            # 会话超时时间

    # HSTS 配置（可选，强制浏览器后续优先用 HTTPS，摘要4推荐）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 你的业务配置（如指向 swap 项目的 dist 目录）
       location / {
        root  /root/bpm-swap-dapp/dist;  # 项目根目录
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # 适配 Vue History 路由
    }

    # 若需保留 /swap 路径（参考你之前的需求）
    location ^~ /swap {
        alias  /root/bpm-swap-dapp/dist/; # 末尾加 /，避免路径拼接错误
        index  index.html;
        try_files $uri $uri/ /swap/index.html;
    }
}

