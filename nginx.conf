server {
    listen 443 ssl;
    server_name metaassetschain.org;

    ssl_certificate     /root/ma/https-keys/ma.pem;
    ssl_certificate_key /root/ma/https-keys/ma.key;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 主站
    location / {
        root /root/ma/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 矿池 DApp
    location /pool/ {
        alias /root/ma-pool/dist/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 水龙头
    location /faucet/ {
        alias /root/ma/faucet/;
        index index.html;
    }
}


server {
    listen 443 ssl;
    server_name clawservice.metaassetschain.org;

    ssl_certificate     /root/ma/https-keys/clawservice.metaassetschain.org.pem;
    ssl_certificate_key /root/ma/https-keys/clawservice.metaassetschain.org.key;

    ssl_session_timeout     5m;
    ssl_ciphers     ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols   TLSv1.2 TLSv1.3;
    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        root /root/ma/clawmask/out;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /download/ {
        alias /root/ma/clawmask/download/;
        add_header Content-Disposition "attachment";
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:8156/api/;
    }

    location /ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8156/ws;
    }
}

server {
    listen 80;
    server_name clawservice.metaassetschain.org;
    return 301 https://$host$request_uri;
}


