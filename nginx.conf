user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;



server {
       listen  443 ssl; #监听端口
       server_name dapp.aie.land; #请求域名
       ssl_certificate         /root/https-key/dapp.aie.land_nginx/dapp.aie.land.pem; #pem证书路径
       ssl_certificate_key     /root/https-key/dapp.aie.land_nginx/dapp.aie.land.key; #pem证书key路径
       ssl_session_timeout     5m; #会话超时时间
       ssl_ciphers     ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4; #加密算法
       ssl_protocols   TLSv1 TLSv1.1 TLSv1.2; #SSL协议
      client_max_body_size 20M;  # 允许上传最大 20MB 的文件
       location / {
               #    proxy_http_version 1.1; #代理使用的http协议
               # proxy_set_header Host $host; #header添加请求host信息
               # proxy_set_header X-Real-IP $remote_addr; # header增加请求来源IP信息
               # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 增加代理记录
             #linux下HTML文件夹,就是你的前端项目文件夹
            root  /root/ai-x-dapp/dist;
            #输入网址（server_name：port）后，默认的访问页面
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;

         }

         location /api {
            proxy_http_version 1.1; #代理使用的http协议
            proxy_set_header Host $host; #header添加请求host信息
            proxy_set_header X-Real-IP $remote_addr; # header增加请求来源IP信息
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 增加代理记录
            proxy_pass http://127.0.0.1:4012; #服务A访问地址

        }


 }

